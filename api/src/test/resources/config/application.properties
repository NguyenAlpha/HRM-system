# Chỉ dùng khi chạy test: Spring Boot nạp classpath:/config/application.properties sau
# classpath:/application.properties, nên file này chỉ ghi đè các key bên dưới.
#
# Mỗi cấu hình @SpringBootTest khác nhau là một application context riêng, được cache lại giữa các
# test, và mỗi context giữ một pool kết nối. Với pool mặc định (10 kết nối, luôn giữ đủ) cả suite
# vượt max_connections = 100 của Postgres → "too many clients already". Pool nhỏ và đóng kết nối
# rảnh sau 10 giây thì các context đang nằm trong cache không giữ kết nối nữa.
# Tối đa 3: đủ cho một transaction cộng một transaction REQUIRES_NEW lồng bên trong.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000

