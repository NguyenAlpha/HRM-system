spring.application.name=hrm

# PostgreSQL. Default values match the database service in docker-compose.yaml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hrm}
spring.datasource.username=${DB_USERNAME:hrm-user}
spring.datasource.password=${DB_PASSWORD:hrm-password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Bootstrap the company profile, work locations, organization units, and job positions.
company.seed.enabled=${COMPANY_SEED_ENABLED:true}

# Seed built-in roles, permissions, and their default mappings.
rbac.seed.enabled=${RBAC_SEED_ENABLED:true}

# Bootstrap system administrator. Keep disabled by default and provide the password via environment.
admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.seed.username=${ADMIN_SEED_USERNAME:admin}
admin.seed.email=${ADMIN_SEED_EMAIL:admin@hrm.local}
admin.seed.password=${ADMIN_SEED_PASSWORD:Admin@123}

# Seed a ready-to-use Company Owner (username: owner, password: password) with a primary assignment, dated 2 years back,
# and attendance (PRESENT, a few late or early days) for every workday from then until yesterday.
owner.seed.enabled=${OWNER_SEED_ENABLED:true}

# Seed staff listed in a JSON file (accounts, roles, primary assignment, attendance), after the Company Owner.
# Entries whose username already exists are skipped. See the default file for the fields.
staff.seed.enabled=${STAFF_SEED_ENABLED:true}
staff.seed.file=${STAFF_SEED_FILE:classpath:seed/staff.json}

# Seed a payroll period for every month from the first hire to last month through the payroll engine, while none exists yet.
payroll.seed.enabled=${PAYROLL_SEED_ENABLED:true}

# Prepare the current month's attendance (MISSING_PUNCH rows) at startup and at 00:05 every night.
attendance.auto-prepare.enabled=${ATTENDANCE_AUTO_PREPARE_ENABLED:true}

# JWT access tokens. JWT_SECRET must be Base64 and decode to at least 32 bytes.
jwt.secret=${JWT_SECRET:myTuPb9dqZfLuS4mxuZa6XlvX/I/B7Y3AsB6J1hUpNo=}
jwt.issuer=${JWT_ISSUER:https://hrm.local}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# Single-use token used by a pending account to choose its first password.
account.activation-token-expiration-hours=${ACCOUNT_ACTIVATION_TOKEN_EXPIRATION_HOURS:24}

# Comma-separated frontend origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OpenAPI spec (/v3/api-docs) and Swagger UI (/swagger-ui.html). Set API_DOCS_ENABLED=false outside development.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.default-produces-media-type=application/json
# Stable key order keeps the committed spec snapshot (apps/web/openapi.json) diff-friendly.
springdoc.writer-with-order-by-keys=true

# Rate limiting, kept in memory (lost on restart, not shared between instances). See docs/concepts/RATE_LIMIT.md.
# Each policy allows max-requests per window-seconds; the defaults suit development and demos.
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Proxies (IPs or CIDR ranges) whose X-Forwarded-For is believed: the web app's server. Leave empty when
# browsers call the backend directly. Never list client ranges.
rate-limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}
# Per client IP, checked before authentication.
rate-limit.policies.login.max-requests=${RATE_LIMIT_LOGIN_MAX_REQUESTS:20}
rate-limit.policies.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
rate-limit.policies.refresh.max-requests=${RATE_LIMIT_REFRESH_MAX_REQUESTS:30}
rate-limit.policies.refresh.window-seconds=${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
rate-limit.policies.activation.max-requests=${RATE_LIMIT_ACTIVATION_MAX_REQUESTS:10}
rate-limit.policies.activation.window-seconds=${RATE_LIMIT_ACTIVATION_WINDOW_SECONDS:60}
rate-limit.policies.ip-ceiling.max-requests=${RATE_LIMIT_IP_CEILING_MAX_REQUESTS:1200}
rate-limit.policies.ip-ceiling.window-seconds=${RATE_LIMIT_IP_CEILING_WINDOW_SECONDS:60}
# Wrong passwords per account; the account is never locked, only made to wait.
rate-limit.policies.login-failure.max-requests=${RATE_LIMIT_LOGIN_FAILURE_MAX_REQUESTS:5}
rate-limit.policies.login-failure.window-seconds=${RATE_LIMIT_LOGIN_FAILURE_WINDOW_SECONDS:900}
# Per signed-in user; a specific policy replaces the default "api" quota for its endpoints.
rate-limit.policies.api.max-requests=${RATE_LIMIT_API_MAX_REQUESTS:300}
rate-limit.policies.api.window-seconds=${RATE_LIMIT_API_WINDOW_SECONDS:60}
rate-limit.policies.password.max-requests=${RATE_LIMIT_PASSWORD_MAX_REQUESTS:5}
rate-limit.policies.password.window-seconds=${RATE_LIMIT_PASSWORD_WINDOW_SECONDS:600}
rate-limit.policies.export.max-requests=${RATE_LIMIT_EXPORT_MAX_REQUESTS:10}
rate-limit.policies.export.window-seconds=${RATE_LIMIT_EXPORT_WINDOW_SECONDS:600}
rate-limit.policies.report.max-requests=${RATE_LIMIT_REPORT_MAX_REQUESTS:60}
rate-limit.policies.report.window-seconds=${RATE_LIMIT_REPORT_WINDOW_SECONDS:60}
rate-limit.policies.heavy-write.max-requests=${RATE_LIMIT_HEAVY_WRITE_MAX_REQUESTS:10}
rate-limit.policies.heavy-write.window-seconds=${RATE_LIMIT_HEAVY_WRITE_WINDOW_SECONDS:60}

# Request metrics (http.server.requests) feed GET /api/system/traffic/stats; no /actuator endpoint is exposed.
management.endpoints.web.exposure.exclude=*
