name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Matches docker-compose.yaml; the tests run Flyway and the seeders against an empty database.
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrm
          POSTGRES_USER: hrm-user
          POSTGRES_PASSWORD: hrm-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm-user -d hrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # mvnw is committed without the executable bit.
      - run: sh ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Includes check:api, which fails when lib/api-schema.ts is stale against openapi.json.
      - run: npm run typecheck
      - run: npm run build
